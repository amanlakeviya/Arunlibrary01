<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Info Card Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lora:wght@400;700&family=EB+Garamond:wght@400;700;800&family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f2;--fg:#1c1c1c;--card:#fff;--bd:#d8d8d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#eee;--card:#222;--bd:#3a3a3a}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){.w{grid-template-columns:340px 1fr}}
.p{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.g{display:grid;gap:8px;padding:10px;border:1px dashed var(--bd);border-radius:10px}
label{font-size:13px;display:grid;gap:4px}
small{opacity:.7;font-size:12px;line-height:1.4}
hr{width:100%;border:0;border-top:1px solid var(--bd);margin:2px 0}
input[type=text],textarea,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.r{display:flex;gap:8px}.r>*{flex:1}input[type=color]{width:100%;height:36px;border:1px solid var(--bd);border-radius:8px;padding:2px;background:none}
.ck{display:flex;align-items:center;gap:6px;font-size:13px}
button{padding:12px;border:0;border-radius:10px;background:#2e7d32;color:#fff;font-size:15px;font-weight:600}
canvas{width:100%;height:auto;border-radius:10px;border:1px solid var(--bd);display:block}
</style></head><body>
<div class="w">
<div class="p">
<label>📚 Book photo / cover (upload your own)<input type="file" id="f" accept="image/*"></label>
<label>Big title (1-3 lines)<textarea id="t" rows="2">Your Book
Title Here</textarea></label>
<div class="r"><label>Bar label (bold)<input type="text" id="sl" value="Skill:"></label><label>Bar text<input type="text" id="sv" value="Building Habits"></label></div>
<div class="g"><b style="font-size:13px">📋 Info rows (leave text empty to hide a row)</b><div id="rows" style="display:grid;gap:8px"></div></div>
<label>Bottom handle (leave empty to hide)<input type="text" id="h" value="@yourhandle | Your Name"></label>
<label class="ck"><input type="checkbox" id="lg" checked> Show round logo (bottom-left)</label>
<label>Round logo photo (optional)<input type="file" id="lf" accept="image/*"></label>
<div class="r"><label>Paper<input type="color" id="pc" value="#f3e4d6"></label><label>Text<input type="color" id="tc" value="#111111"></label></div>
<div class="r"><label>Bar color 1<input type="color" id="g1" value="#f7d94c"></label><label>Bar color 2<input type="color" id="g2" value="#a8d65a"></label></div>
<label>Title font<select id="ff"><option>Playfair Display</option><option>EB Garamond</option><option>Libre Baskerville</option><option>Lora</option><option>Poppins</option></select></label>
<label>Title size<input type="range" id="tz" min="50" max="130" value="100"></label>
<label>Info text size<input type="range" id="rz" min="60" max="130" value="100"></label>
<label>Info rows up/down<input type="range" id="ry" min="-200" max="200" value="0"></label>
<hr>
<label>Book zoom<input type="range" id="bz" min="40" max="160" value="100"></label>
<div class="r"><label>Book left/right<input type="range" id="bx" min="-300" max="300" value="0"></label><label>Book up/down<input type="range" id="by" min="-300" max="300" value="0"></label></div>
<label>Book tilt<input type="range" id="br" min="-20" max="20" value="-4"></label>
<label class="ck"><input type="checkbox" id="e3" checked> 3D book edge</label>
<label class="ck"><input type="checkbox" id="tx" checked> Paper texture</label>
<label class="ck"><input type="checkbox" id="dg" checked> ✋ Drag the book with finger/mouse</label>
<button id="d">⬇ PNG Download</button>
</div>
<canvas id="c" width="1080" height="1350"></canvas>
</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
let img=null,logo=null,dr=null;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ICONS=[['book','Open book'],['clock','Clock'],['bolt','Lightning'],['star','Star'],['check','Check'],['heart','Heart'],['target','Target'],['flag','Flag']];
const DEF=[['book','Pages: 250'],['clock','Time: 5–6 hours'],['bolt','Effort: Moderate'],['star','Rating: 4.5/5']];
DEF.forEach((d,i)=>{const w=document.createElement('div');w.className='r';
 w.innerHTML=`<select id="ic${i}">${ICONS.map(([v,n])=>`<option value="${v}"${v===d[0]?' selected':''}>${n}</option>`).join('')}</select><input type="text" id="rt${i}" value="${d[1]}" style="flex:2">`;$('rows').appendChild(w)});
function load(id,cb){$(id).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>cb(i);i.src=r.result};r.readAsDataURL(f)}}
load('f',i=>{img=i});load('lf',i=>{logo=i});
$('dg').addEventListener('change',()=>{cv.style.touchAction=$('dg').checked?'none':'auto';cv.style.cursor=$('dg').checked?'grab':'default'});
cv.style.touchAction='none';cv.style.cursor='grab';
cv.addEventListener('pointerdown',e=>{if(!$('dg').checked)return;const r=cv.getBoundingClientRect();dr={x:e.clientX,y:e.clientY,ox:+$('bx').value,oy:+$('by').value,sc:1080/r.width};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dr)return;$('bx').value=dr.ox+(e.clientX-dr.x)*dr.sc;$('by').value=dr.oy+(e.clientY-dr.y)*dr.sc});
cv.addEventListener('pointerup',()=>{dr=null});
function icon(n,cx,cy,s,col){x.save();x.translate(cx,cy);x.scale(s/90,s/90);x.strokeStyle=col;x.lineWidth=7;x.lineCap='round';x.lineJoin='round';x.beginPath();
 switch(n){
  case 'book':x.roundRect(-42,-30,84,60,6);x.moveTo(0,-30);x.lineTo(0,30);break;
  case 'clock':x.arc(0,0,40,0,7);x.moveTo(0,-20);x.lineTo(0,2);x.lineTo(18,14);break;
  case 'bolt':x.moveTo(10,-44);x.lineTo(-28,6);x.lineTo(-4,6);x.lineTo(-14,44);x.lineTo(30,-8);x.lineTo(6,-8);x.closePath();break;
  case 'star':for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?18:44;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();break;
  case 'check':x.arc(0,0,40,0,7);x.moveTo(-18,2);x.lineTo(-4,16);x.lineTo(20,-14);break;
  case 'heart':x.moveTo(0,34);x.bezierCurveTo(-60,-6,-30,-52,0,-22);x.bezierCurveTo(30,-52,60,-6,0,34);break;
  case 'target':x.arc(0,0,40,0,7);x.moveTo(24,0);x.arc(0,0,24,0,7);x.moveTo(8,0);x.arc(0,0,8,0,7);break;
  case 'flag':x.moveTo(-24,44);x.lineTo(-24,-44);x.lineTo(30,-28);x.lineTo(-24,-10);break}
 x.stroke();x.restore()}
function draw(){
 const tc=$('tc').value,ff=$('ff').value;x.textBaseline='alphabetic';x.textAlign='left';
 // paper
 x.fillStyle=$('pc').value;x.fillRect(0,0,1080,1350);
 if($('tx').checked){const R=rng(7);for(let i=0;i<9000;i++){x.fillStyle=R()<.5?`rgba(120,90,60,${R()*.06})`:`rgba(255,255,255,${R()*.12})`;x.fillRect(R()*1080,R()*1350,1+R()*2,1+R()*2)}
  for(let i=0;i<14;i++){const cx=R()*1080,cy=R()*1350,r=120+R()*260,g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,`rgba(150,110,70,${.03+R()*.04})`);g.addColorStop(1,'rgba(150,110,70,0)');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}}
 // title
 const T=$('t').value.split('\n').filter(s=>s.trim()).slice(0,3);
 let fs=190*$('tz').value/100;x.font=`900 ${fs}px "${ff}",serif`;
 while(T.length&&Math.max(...T.map(l=>x.measureText(l).width))>960&&fs>40){fs-=3;x.font=`900 ${fs}px "${ff}",serif`}
 const lh=fs*1.02;x.fillStyle=tc;x.textAlign='center';let y=110+fs*.86;
 T.forEach(l=>{x.fillText(l,540,y);y+=lh});
 const tb=y-lh+fs*.22;
 // gradient bar + text
 const bh=108,by=tb+16,g=x.createLinearGradient(125,0,955,0);g.addColorStop(0,$('g1').value);g.addColorStop(1,$('g2').value);
 x.fillStyle=g;x.fillRect(125,by,830,bh);
 const lab=$('sl').value,val=$('sv').value;let sf=84,wl=0,wv=0;
 const meas=()=>{x.font=`700 ${sf}px "${ff}",serif`;wl=x.measureText(lab).width;x.font=`400 ${sf}px "${ff}",serif`;wv=x.measureText(val?' '+val:'').width;return wl+wv};
 while(meas()>790&&sf>28)sf-=2;
 x.textAlign='left';const st=540-(wl+wv)/2,sy=by+bh*.72;
 x.fillStyle='#111';x.font=`700 ${sf}px "${ff}",serif`;x.fillText(lab,st,sy);x.font=`400 ${sf}px "${ff}",serif`;x.fillText(val?' '+val:'',st+wl,sy);
 // book
 const top=by+bh+50,bot=1190,boxH=bot-top;
 if(img){const s=Math.min(560/img.width,boxH/img.height)*$('bz').value/100,iw=img.width*s,ih=img.height*s,cx=330+ +$('bx').value,cy=top+boxH/2+ +$('by').value;
  x.save();x.translate(cx,cy);x.rotate($('br').value*Math.PI/180);
  if($('e3').checked){x.fillStyle='#cdbfa6';x.beginPath();x.moveTo(-iw/2,-ih/2);x.lineTo(-iw/2-20,-ih/2+12);x.lineTo(-iw/2-20,ih/2+12);x.lineTo(-iw/2,ih/2);x.closePath();x.fill();
   x.fillStyle='#e9dfcb';x.beginPath();x.moveTo(-iw/2,ih/2);x.lineTo(-iw/2-20,ih/2+12);x.lineTo(iw/2-20,ih/2+12);x.lineTo(iw/2,ih/2);x.closePath();x.fill()}
  x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=40;x.shadowOffsetX=18;x.shadowOffsetY=28;x.drawImage(img,-iw/2,-ih/2,iw,ih);x.restore()}
 else{x.fillStyle='rgba(0,0,0,.06)';x.fillRect(90,top+20,480,boxH-40);x.fillStyle='rgba(0,0,0,.4)';x.font='600 30px Poppins,sans-serif';x.textAlign='center';x.fillText('Upload your book photo',330,top+boxH/2)}
 // info rows
 const rows=[0,1,2,3].map(i=>({ic:$('ic'+i).value,t:$('rt'+i).value.trim()})).filter(r=>r.t);
 if(rows.length){let rf=56*$('rz').value/100;const maxW=1055-735;x.font=`400 ${rf}px Lora,serif`;
  while(Math.max(...rows.map(r=>x.measureText(r.t).width))>maxW&&rf>20){rf-=2;x.font=`400 ${rf}px Lora,serif`}
  const sp=Math.min(130,(boxH-40)/rows.length),c0=top+boxH/2+ +$('ry').value;x.textAlign='left';
  rows.forEach((r,i)=>{const yy=c0+(i-(rows.length-1)/2)*sp;icon(r.ic,672,yy,84,tc);x.fillStyle=tc;x.font=`400 ${rf}px Lora,serif`;x.fillText(r.t,738,yy+rf*.34)})}
 // bottom handle + logo
 const h=$('h').value.trim();if(h){x.fillStyle=tc;x.font='700 38px Lora,serif';x.textAlign='center';x.fillText(h,540,1305)}
 if($('lg').checked){const cx=90,cy=1272,r=54;x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();x.fillStyle='#fffaf0';x.fillRect(cx-r,cy-r,r*2,r*2);
  if(logo){const s=Math.max(r*2/logo.width,r*2/logo.height),w=logo.width*s,hh=logo.height*s;x.drawImage(logo,cx-w/2,cy-hh/2,w,hh)}else icon('book',cx,cy,56,tc);
  x.restore();x.strokeStyle='#c9a227';x.lineWidth=5;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke()}
}
function loop(){draw();requestAnimationFrame(loop)}
Promise.all([document.fonts.load('900 40px "Playfair Display"'),document.fonts.load('700 40px "Playfair Display"'),document.fonts.load('400 40px "Playfair Display"'),document.fonts.load('400 40px Lora'),document.fonts.load('700 40px Lora')]).then(loop).catch(loop);
$('d').onclick=async()=>{const b=$('d'),t=b.textContent;
 try{const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const dl=window.claude&&await claude.use('downloads');
  if(dl){await dl.save({filename:'book-info-card.png',data:blob})}else{const a=document.createElement('a');a.download='book-info-card.png';a.href=URL.createObjectURL(blob);a.click()}b.textContent='✅ Done!'
 }catch(e){b.textContent=e&&e.code==='declined'?'Cancelled':'❌ Error, try again'}setTimeout(()=>b.textContent=t,2000)};
</script></body></html>
