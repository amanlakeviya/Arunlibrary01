<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insta Book Page Maker 8</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Lora&family=Libre+Baskerville&family=Caveat:wght@700&family=Kalam:wght@400;700&family=Patrick+Hand&family=Dancing+Script:wght@500;700&family=Special+Elite&family=IM+Fell+English&family=Inter:wght@400;600&family=Schoolbell&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f2;--fg:#1c1c1c;--card:#fff;--bd:#d8d8d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#eee;--card:#222;--bd:#3a3a3a}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){.w{grid-template-columns:340px 1fr}}
.p{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.g{display:grid;gap:8px;padding:10px;border:1px dashed var(--bd);border-radius:10px}
.g b{font-size:13px}
label{font-size:13px;display:grid;gap:4px}
small{opacity:.7;font-size:12px;line-height:1.4}
hr{width:100%;border:0;border-top:1px solid var(--bd);margin:2px 0}
input[type=text],textarea,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.r{display:flex;gap:8px}.r>*{flex:1}input[type=color]{width:100%;height:36px;border:1px solid var(--bd);border-radius:8px;padding:2px;background:none}
.ck{display:flex;align-items:center;gap:6px;font-size:13px}
button{padding:12px;border:0;border-radius:10px;background:#2e7d32;color:#fff;font-size:15px;font-weight:600}
canvas{width:100%;height:auto;border-radius:10px;border:1px solid var(--bd);display:block}
.tb{display:flex;gap:6px;flex-wrap:wrap}.tb button{padding:8px 12px;font-size:14px;background:#444}
</style></head><body>
<div class="w">
<div class="p">
<div class="r">
<label>🎨 Style (theme)<select id="th"><option value="classic">1. Classic Tan</option><option value="parchment">2. Parchment (halka)</option><option value="dark">3. Dark Book</option><option value="vintage">4. Vintage Burnt</option><option value="notebook">5. Notebook (lines)</option><option value="navy">6. Midnight Navy</option><option value="sage">7. Sage Green</option></select></label>
<label>📚 Pages ka layout<select id="ly"><option value="single">1 page</option><option value="stack">2 page upar-neeche</option><option value="spread">2 page side-by-side (khuli book)</option></select></label>
</div>
<label>✒️ Page ki writing ka style<select id="ws"><option value="auto">Auto (theme ke hisaab se)</option><option value="book">1. Printed Book (serif, barabar)</option><option value="pen">2. Haath ki likhai (pen)</option><option value="type">3. Typewriter</option><option value="cursive">4. Cursive (sundar likhawat)</option><option value="old">5. Purani Manuscript</option><option value="chalk">6. Chalk / Marker</option><option value="clean">7. Modern Clean</option></select></label>
<div class="g"><b>🖊️ Text formatting (paragraph box me tap karke select karo)</b>
<div class="tb"><button type="button" onpointerdown="event.preventDefault()" onclick="fmt('h')">H Heading</button><button type="button" onpointerdown="event.preventDefault()" onclick="fmt('b')"><b>B</b> Bold</button><button type="button" onpointerdown="event.preventDefault()" onclick="fmt('m')">🖍️ Marker</button><button type="button" onpointerdown="event.preventDefault()" onclick="fmt('u')"><u>U</u> Underline</button><button type="button" onpointerdown="event.preventDefault()" onclick="fmt('c')">✖ Clear</button></div>
<small id="fmsg">Heading: line ke aage <b>#</b> &nbsp; Bold: <b>**text**</b> &nbsp; Marker: <b>==text==</b> &nbsp; Underline: <b>__text__</b></small></div>
<div id="pg"></div>
<div class="r"><label>Slide number<input type="text" id="n" value="2/8"></label><label>Upar naam (sirf page 1)<input type="text" id="au" value="AMAN LAKEVIYA"></label></div>
<label>🗒️ Sticky note title (aakhri page par)<input type="text" id="st" value="Note to Self:"></label>
<label>Sticky note text<textarea id="sb" rows="3">I'm the author of this story. I can start a new chapter whenever I choose to.</textarea></label>
<label>📷 Neeche ki drawing/photo (aakhri page, optional)<input type="file" id="f" accept="image/*"></label>
<div class="r"><label>Paper font<select id="bf"><option>EB Garamond</option><option>Lora</option><option>Libre Baskerville</option><option>Kalam</option><option>Patrick Hand</option><option>Dancing Script</option><option>Special Elite</option><option>IM Fell English</option><option>Inter</option><option>Schoolbell</option></select></label><label>Haath ka font<select id="hf"><option>Caveat</option><option>Kalam</option><option>Patrick Hand</option></select></label></div>
<div class="r"><label>Paper<input type="color" id="pc" value="#dcb98a"></label><label>Text<input type="color" id="tc" value="#2b1d0f"></label></div>
<div class="r"><label>Highlight<input type="color" id="hl" value="#ffe94a"></label><label>Red ink<input type="color" id="ink" value="#c4161c"></label><label>Sticky<input type="color" id="sc" value="#ffdf5c"></label><label>Marker<input type="color" id="mk" value="#ffe94a"></label></div>
<label>Text size<input type="range" id="fz" min="70" max="130" value="100"></label>
<label>⭐ Highlight line ka size<input type="range" id="qz" min="60" max="170" value="100"></label>
<div class="r"><label class="ck"><input type="checkbox" id="qb"> Poori highlight line bold</label><label>Marker (highlight line me)<input type="color" id="mq" value="#ff9ec7"></label></div>
<label>Sticky note tilt<input type="range" id="rot" min="-15" max="15" value="-4"></label>
<label>Sticky upar/neeche<input type="range" id="sy" min="-400" max="400" value="0"></label>
<hr>
<label>Drawing zoom<input type="range" id="iz" min="30" max="250" value="100"></label>
<div class="r"><label>Drawing left/right<input type="range" id="ix" min="-700" max="700" value="0"></label><label>Drawing upar/neeche<input type="range" id="iy" min="-700" max="700" value="0"></label></div>
<label class="ck"><input type="checkbox" id="dg"> ✋ Drawing ko ungli/mouse se khiskao (drag mode)</label>
<button id="d">⬇ PNG Download</button>
</div>
<canvas id="c" width="1080" height="1350"></canvas>
</div>
<script>
const $=i=>document.getElementById(i),cv=$('c');let x=cv.getContext('2d');
const mainX=x;let img=null,dr=null;const pf=[null,null];
const TH={
 classic:{pc:'#dcb98a',tc:'#2b1d0f',hl:'#ffe94a',ink:'#c4161c',sc:'#ffdf5c',bf:'EB Garamond',hf:'Caveat',deco:'paper'},
 parchment:{pc:'#f3e7c9',tc:'#3b2a14',hl:'#ffd966',ink:'#8b1e1e',sc:'#fff0a8',bf:'Lora',hf:'Kalam',deco:'paper'},
 dark:{pc:'#1f1f24',tc:'#e8e3d6',hl:'#7a6420',ink:'#ff6b5b',sc:'#f3c93a',bf:'Libre Baskerville',hf:'Kalam',deco:'plain'},
 vintage:{pc:'#c9a46a',tc:'#3a2410',hl:'#f2d26b',ink:'#7a1a12',sc:'#f0cf6a',bf:'Libre Baskerville',hf:'Patrick Hand',deco:'stains'},
 notebook:{pc:'#fbfaf5',tc:'#1f2a44',hl:'#fff176',ink:'#d32f2f',sc:'#ffe066',bf:'Kalam',hf:'Caveat',deco:'ruled'},
 navy:{pc:'#14213d',tc:'#f1e9d2',hl:'#355a9c',ink:'#ffb703',sc:'#ffd166',bf:'EB Garamond',hf:'Caveat',deco:'grid'},
 sage:{pc:'#dfe5d3',tc:'#22301f',hl:'#fff3a0',ink:'#b3261e',sc:'#ffe082',bf:'Lora',hf:'Kalam',deco:'plain'}};
const WSP={auto:{just:1,size:1,lh:1.34},book:{bf:'EB Garamond',just:1,size:1,lh:1.34},pen:{bf:'Kalam',just:0,size:1.02,lh:1.5},type:{bf:'Special Elite',just:0,size:.86,lh:1.4},cursive:{bf:'Dancing Script',just:0,size:1.1,lh:1.42},old:{bf:'IM Fell English',just:1,size:1.06,lh:1.34},chalk:{bf:'Schoolbell',just:0,size:1.05,lh:1.45},clean:{bf:'Inter',just:0,size:.94,lh:1.4}};
const WS=()=>WSP[$('ws').value]||WSP.auto;
const DT=[
 {pn:'72',pa:'Most of us carry a story about ourselves that keeps growing quietly in the background. If we keep repeating the same negative lines, the story only gets darker. But when we look at ourselves honestly, without too much praise or too much blame, we find a calmer and steadier way to live.',q:'Never forget: YOU write your own life story. YOU can change direction at any given moment.',pb:'Does that mean everything can change overnight? Of course not. But every change begins with a small decision, and that decision only needs one thing: the belief that a better path is possible.',mn:'Always\nRemember'},
 {pn:'73',pa:'Small habits shape the person we slowly become. We rarely notice the change day by day, but a year later the difference is impossible to miss.',q:'Remember: tiny steps, taken daily, build a whole new life.',pb:'You do not need a perfect plan. You only need to begin, and to keep going on the days when it feels slow.',mn:'Read\nthis twice'}];
const pg=$('pg');
for(let i=0;i<2;i++){const d=document.createElement('div');d.className='g';d.id='pgg'+i;const D=DT[i];
 d.innerHTML=`<b>📄 Page ${i+1}</b><label>Page number<input type="text" id="pn${i}" value="${D.pn}"></label><label>Upar ka paragraph<textarea id="pa${i}" rows="4">${D.pa}</textarea></label><label>⭐ Highlight wali line<textarea id="q${i}" rows="2">${D.q}</textarea></label><label>Neeche ka paragraph<textarea id="pb${i}" rows="3">${D.pb}</textarea></label><label>✍️ Side ka haath se likha note<textarea id="mn${i}" rows="2">${D.mn}</textarea></label><label>📖 Asli book page ki photo (optional, text ki jagah lagegi)<input type="file" id="pf${i}" accept="image/*"></label>`;
 pg.appendChild(d);
 d.querySelector('input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const g=new Image();g.onload=()=>{pf[i]=g};g.src=r.result};r.readAsDataURL(f)}}
function vis(){$('pgg1').style.display=$('ly').value==='single'?'none':'grid'}
$('f').onchange=e=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{img=i};i.src=r.result};r.readAsDataURL(e.target.files[0])};
document.querySelectorAll('input,textarea,select').forEach(e=>{if(e.type!=='file')e.oninput=()=>{vis()}});vis();
$('th').oninput=()=>{const t=TH[$('th').value];['pc','tc','hl','ink','sc','bf','hf'].forEach(k=>{if(k==='bf'&&$('ws').value!=='auto')return;$(k).value=t[k]})};
$('ws').oninput=()=>{const w=WS();$('bf').value=w.bf||TH[$('th').value].bf};
$('dg').addEventListener('change',()=>{cv.style.touchAction=$('dg').checked?'none':'auto';cv.style.cursor=$('dg').checked?'grab':'default'});
cv.addEventListener('pointerdown',e=>{if(!$('dg').checked)return;const r=cv.getBoundingClientRect();dr={x:e.clientX,y:e.clientY,ox:+$('ix').value,oy:+$('iy').value,sc:1080/r.width};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dr)return;$('ix').value=dr.ox+(e.clientX-dr.x)*dr.sc;$('iy').value=dr.oy+(e.clientY-dr.y)*dr.sc});
cv.addEventListener('pointerup',()=>{dr=null});
let lastTA=null;$('pg').addEventListener('focusin',e=>{if(e.target.tagName==='TEXTAREA')lastTA=e.target});
function fmt(k){const t=lastTA,m=$('fmsg');if(!t){m.textContent='Pehle neeche kisi paragraph box me tap karo.';return}
 const a=t.selectionStart,b=t.selectionEnd,v=t.value;
 if(k==='h'){const ls=v.lastIndexOf('\n',a-1)+1,le=v.indexOf('\n',b),end=le<0?v.length:le,line=v.slice(ls,end);t.value=v.slice(0,ls)+(/^#+\s/.test(line)?line.replace(/^#+\s+/,''):'# '+line)+v.slice(end)}
 else if(k==='c'){t.value=v.replace(/\*\*|==|__/g,'').replace(/^#+\s/gm,'')}
 else{if(a===b){m.textContent='Pehle jis text par lagana hai use select karo.';return}const q={b:'**',m:'==',u:'__'}[k];t.value=v.slice(0,a)+q+v.slice(a,b)+q+v.slice(b)}
 m.textContent='✅ Lag gaya! Heading: # | Bold: ** | Marker: == | Underline: __';t.focus()}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgba(h,a){const n=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));return`rgba(${n},${a})`}
function wrap(text,W,ind){const ws=text.split(/\s+/).filter(Boolean),lines=[],sp=x.measureText(' ').width;let cur=[],cw=0,av=W-ind;
 ws.forEach(w=>{const m=x.measureText(w).width;if(cur.length&&cw+sp+m>av){lines.push({a:cur,w:cw});cur=[];cw=0;av=W}cw+=(cur.length?sp:0)+m;cur.push({w,m})});
 if(cur.length)lines.push({a:cur,w:cw});return lines}
function justDraw(lines,x0,y,W,lh,ind){const sp=x.measureText(' ').width;x.textAlign='left';
 lines.forEach((l,i)=>{const o=i===0?ind:0,av=W-o,sum=l.a.reduce((a,t)=>a+t.m,0);const gap=(i<lines.length-1&&l.a.length>1&&WS().just)?(av-sum)/(l.a.length-1):sp;
  let p=x0+o;const by=y+lh*(i+.8);l.a.forEach(t=>{x.fillText(t.w,p,by);p+=t.m+gap})})}
function toks(s){const out=[];let b=false,h=false,u=false;s.split(/(\*\*|==|__)/).forEach(p=>{if(p==='**')b=!b;else if(p==='==')h=!h;else if(p==='__')u=!u;else p.split(/\s+/).filter(Boolean).forEach(w=>out.push({w,b,h,u}))});return out}
function tf(t,f,head,bf){return`${(t.b||head)?700:400} ${f}px "${bf}",serif`}
function flow(text,W,ind,fs,lh,bf){
 const blocks=text.split('\n').map(s=>s.trim()).filter(Boolean),lines=[];let hy=0;
 blocks.forEach((bl,bi)=>{const head=/^#+\s/.test(bl);if(head)bl=bl.replace(/^#+\s+/,'');
  const f=head?fs*1.5:fs,lhh=head?f*1.2:lh;x.font=`400 ${f}px "${bf}",serif`;const sp=x.measureText(' ').width;
  const T=toks(bl).map(t=>{x.font=tf(t,f,head,bf);return{...t,m:x.measureText(t.w).width}});
  const n0=lines.length;let cur=[],cw=0,av=W-(head?0:ind),first=true;
  const push=()=>{lines.push({a:cur,w:cw,head,f,lh:lhh,sp,ind:first&&!head?ind:0,y:hy,last:false});hy+=lhh;cur=[];cw=0;first=false;av=W};
  T.forEach(t=>{if(cur.length&&cw+sp+t.m>av)push();cw+=(cur.length?sp:0)+t.m;cur.push(t)});
  if(cur.length)push();if(lines.length>n0)lines[lines.length-1].last=true;
  hy+=head?f*.15:(bi<blocks.length-1?lh*.3:0)});
 return{lines,h:hy}}
function drawFlow(fl,x0,y0,W,fs,bf){const tc=$('tc').value,ink=$('ink').value,just=WS().just;x.textAlign='left';
 fl.lines.forEach(l=>{const by=y0+l.y+l.lh*.8,av=W-l.ind,sum=l.a.reduce((a,t)=>a+t.m,0);
  const gap=(just&&!l.head&&!l.last&&l.a.length>1)?(av-sum)/(l.a.length-1):l.sp;
  let p=x0+l.ind;const pos=l.a.map(t=>{const q=p;p+=t.m+gap;return q});
  l.a.forEach((t,j)=>{if(!t.h)return;const nx=l.a[j+1]&&l.a[j+1].h,x1=pos[j]-4,x2=nx?pos[j+1]:pos[j]+t.m+4;
   x.save();x.fillStyle=$('mk').value;x.globalAlpha=.72;x.beginPath();x.roundRect(x1,by-l.f*.8,x2-x1,l.f*1.0,3);x.fill();
   x.globalAlpha=.3;x.beginPath();x.roundRect(x1+2,by-l.f*.74+2,x2-x1,l.f*1.0,3);x.fill();x.restore()});
  l.a.forEach((t,j)=>{x.font=tf(t,l.f,l.head,bf);x.fillStyle=tc;x.fillText(t.w,pos[j],by);
   if(t.u){x.fillStyle=ink;x.fillRect(pos[j],by+l.f*.14,t.m,3)}})})}
function tfq(t,f,head,bf){return`${(t.b||head||$('qb').checked)?700:400} ${f}px "${bf}",serif`}
function flowQ(text,W,qs,bf){const blocks=text.split('\n').map(s=>s.trim()).filter(Boolean),lines=[];let hy=0;
 blocks.forEach(bl=>{const head=/^#+\s/.test(bl);if(head)bl=bl.replace(/^#+\s+/,'');const f=head?qs*1.3:qs,lhq=f*1.38;
  x.font=`400 ${f}px "${bf}",serif`;const sp=x.measureText(' ').width;
  const T=toks(bl).map(t=>{x.font=tfq(t,f,head,bf);return{...t,m:x.measureText(t.w).width}});
  let cur=[],cw=0;const push=()=>{lines.push({a:cur,w:cw,f,lh:lhq,sp,head,y:hy});hy+=lhq;cur=[];cw=0};
  T.forEach(t=>{if(cur.length&&cw+sp+t.m>W)push();cw+=(cur.length?sp:0)+t.m;cur.push(t)});if(cur.length)push()});
 return{lines,h:hy}}
function heart(cx,cy,s){x.beginPath();x.moveTo(cx,cy+s*.35);x.bezierCurveTo(cx-s,cy-s*.3,cx-s*.5,cy-s,cx,cy-s*.35);x.bezierCurveTo(cx+s*.5,cy-s,cx+s,cy-s*.3,cx,cy+s*.35);x.stroke()}
function star(cx,cy,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.stroke()}
function drawBg(W,H,deco,seed){
 x.fillStyle=$('pc').value;x.fillRect(0,0,W,H);const R=rng(11+seed*5);
 if(deco==='paper'||deco==='stains'){const n=Math.round(W*H/200);for(let i=0;i<n;i++){x.fillStyle=`rgba(${R()<.5?'80,50,20':'255,240,210'},${R()*.07})`;x.fillRect(R()*W,R()*H,2,2)}}
 if(deco==='stains'){for(let i=0;i<9;i++){const cx=R()*W,cy=R()*H,r=60+R()*160,g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,`rgba(90,50,10,${.1+R()*.12})`);g.addColorStop(1,'rgba(90,50,10,0)');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
  const v=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(70,30,0,.55)');x.fillStyle=v;x.fillRect(0,0,W,H)}
 else if(deco==='paper'){const v=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.67);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(60,30,0,.28)');x.fillStyle=v;x.fillRect(0,0,W,H)}
 else if(deco==='plain'){const v=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.7);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.25)');x.fillStyle=v;x.fillRect(0,0,W,H)}
 else if(deco==='ruled'){x.strokeStyle='rgba(70,110,200,.35)';x.lineWidth=2;for(let yy=120;yy<H;yy+=54){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}
  x.strokeStyle='rgba(220,40,40,.5)';x.beginPath();x.moveTo(W*.085,0);x.lineTo(W*.085,H);x.stroke()}
 else if(deco==='grid'){x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=1;for(let xx=0;xx<W;xx+=44){x.beginPath();x.moveTo(xx,0);x.lineTo(xx,H);x.stroke()}for(let yy=0;yy<H;yy+=44){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}}}
function layout(f,W,H,i){const k=$('fz').value/100,ws=WS(),bf=$('bf').value,base=W>=1000?1:.72,hs=H<800?.7:1,fs=40*f*k*base*ws.size,qs=46*f*k*base*ws.size*($('qz').value/100),lh=fs*ws.lh,qlh=qs*(ws.lh+.04),mL=W>=1000?80:36,TW=W-2*mL,ruleL=W*.125,ruleR=W-W*.06,QW=(ruleR-ruleL)*.9,ind=40*base;
 x.font=`${fs}px "${bf}",serif`;const L1=flow($('pa'+i).value,TW,ind,fs,lh,bf),L2=flow($('pb'+i).value,TW,ind,fs,lh,bf);
 x.font=`600 ${qs}px "${bf}",serif`;const LQ=flowQ($('q'+i).value,QW,qs,bf);
 let y=H<800?92:118;const y1=y;y+=L1.h+30*hs;const rt=y;y+=26*hs;const qy=y;y+=LQ.h+10;const rb=y;y+=34*hs;const y2=y;y+=L2.h;
 return{fs,qs,lh,qlh,mL,TW,ruleL,ruleR,L1,L2,LQ,y1,rt,qy,rb,y2,end:y,ind,base}}
function drawPage(W,H,i,last){
 const th=TH[$('th').value],bf=$('bf').value,hf=$('hf').value,ink=$('ink').value,tc=$('tc').value,spread=$('ly').value==='spread';
 drawBg(W,H,th.deco,i);
 if(pf[i]){const g=pf[i],s=Math.max(W/g.width,H/g.height),w=g.width*s,h=g.height*s;x.drawImage(g,(W-w)/2,(H-h)/2,w,h);return}
 const base=W>=1000?1:.72,hs=H<800?.7:1,mL=W>=1000?80:36;
